version: "3.9"
services:
  devopsdb:
    image: ganeshdhanala/automation:db
    ports:
      - "1234:3306"
    deploy:
      replicas: 3
    networks:
      - mynetwork

  application:
    image: ganeshdhanala/automation:myapp
    ports:
      - "3333:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
